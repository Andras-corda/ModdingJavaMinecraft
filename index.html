<!DOCTYPE html>
<html lang="fr" data-theme="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Guide complet, de A à Z, pour créer un mod Minecraft Forge 1.20.1 : installation du JDK, MDK, IntelliJ IDEA, Visual Studio Code, travail en équipe avec Git et bonnes pratiques."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1c6b3c" />
    <title>Guide Minecraft Forge 1.20.1</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <!-- ?v=… : incrémentez ce numéro à chaque modif d'un fichier CSS/JS
         pour forcer les navigateurs à recharger (contourne le cache). -->
    <link rel="stylesheet" href="assets/css/style.css?v=5" />
    <script>
      /* ------------------------------------------------------------------
       * Personnalisez ces valeurs après avoir publié le dépôt.
       * ------------------------------------------------------------------ */
      window.SITE_CONFIG = {
        repoUrl: "https://github.com/VOTRE-UTILISATEUR/VOTRE-DEPOT",
      };
      /* Applique le thème + l'état de la barre latérale avant le premier
       * rendu (anti-flash). */
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light")
            document.documentElement.setAttribute("data-theme", t);
          if (localStorage.getItem("sidebar") === "collapsed")
            document.documentElement.classList.add("sidebar-collapsed");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>

    <header class="topbar">
      <button
        id="menu-toggle"
        class="icon-btn menu-toggle"
        type="button"
        aria-label="Afficher ou masquer le menu"
        title="Afficher ou masquer le menu"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"
          />
        </svg>
      </button>

      <a class="brand" href="#/accueil">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Zm0 2.3 6.5 3.2L12 10.7 5.5 7.5 12 4.3ZM5 9.2l6 3v7.3l-6-3V9.2Zm14 0v7.3l-6 3v-7.3l6-3Z"
          />
        </svg>
        <span>Guide Forge <b>1.20.1</b></span>
      </a>

      <div class="search">
        <input
          id="search-input"
          type="search"
          placeholder="Rechercher…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Rechercher dans le guide"
        />
        <div id="search-results" class="search-results"></div>
      </div>

      <a
        id="repo-link"
        class="icon-btn gh-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Dépôt GitHub"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.76.4-1.27.74-1.56-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.2-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.5 3.17-1.18 3.17-1.18.63 1.6.23 2.76.11 3.05.75.81 1.2 1.84 1.2 3.1 0 4.43-2.7 5.4-5.28 5.69.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"
          />
        </svg>
      </a>

      <button
        id="theme-toggle"
        class="icon-btn"
        type="button"
        aria-label="Changer de thème"
      >
        <svg
          class="icon-sun"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5h0v3m0 14v3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M2 12h3m14 0h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <svg
          class="icon-moon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
          />
        </svg>
      </button>
    </header>

    <div class="layout">
      <aside id="sidebar" class="sidebar">
        <nav id="nav" class="nav" aria-label="Navigation du guide"></nav>
        <div class="sidebar-foot">
          Contenu sous licence CC BY 4.0 — Code sous licence MIT
        </div>
      </aside>
      <div id="backdrop" class="backdrop"></div>

      <main id="contenu" class="content">
        <article id="article" class="markdown-body" aria-live="polite">
          <p class="loading">Chargement…</p>
        </article>
        <nav id="pager" class="pager" aria-label="Pages précédente et suivante"></nav>
      </main>

      <aside id="toc" class="toc" aria-label="Sommaire de la page"></aside>
    </div>

    <script src="assets/js/highlight.js?v=5"></script>
    <script src="assets/js/markdown.js?v=5"></script>
    <script src="assets/js/app.js?v=5"></script>
  </body>
</html>
